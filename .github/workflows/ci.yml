name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  python:
    name: Python — ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        # The suite is data-free: it uses synthetic signals and a mock model,
        # so it does not need the (gitignored, 77 MB) MIT-BIH download.
        run: pytest

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # package-lock.json is gitignored in this repo, so `npm ci` (which requires
      # a committed lockfile) can't be used — install from package.json instead.
      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
